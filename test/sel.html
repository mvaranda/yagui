<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Select</title>
    <link rel="stylesheet" href="css/chosen.css">
    <link rel="stylesheet" href="css/ImageSelect.css">
</head>

<body>

    <p>Static select</p>
    <select class="my-select">
        <option data-img-src="images/image.png">Text 1</option> 
        <option data-img-src="images/image.png">Text 2</option> 
        <option data-img-src="images/image.png">Text 3</option> 
        <option data-img-src="images/image.png">Text 4</option>
        <option data-img-src="images/image.png">Text 5</option> 
        <option data-img-src="images/image.png">Text 6</option> 
        <option data-img-src="images/image.png">Text 7</option> 
        <option data-img-src="images/image.png">Text 8</option> 
    </select>

    <!-- <p>Dynamic select</p>
    <div id="selectContainer">
    </div> -->

  <script src="lib/jquery.min.js" type="text/javascript"></script>
  <script src="lib/chosen.jquery.js" type="text/javascript"></script>
  <script src="lib/ImageSelect.jquery.js" type="text/javascript"></script>

  <script type="text/javascript">
// Create an array to store all image elements on the page
const images = Array.from(document.images);

// Preload each image by setting their src attribute and checking if they are fully loaded
images.forEach(image => {
    const imgSrc = image.src;
    image.src = ""; // Clear the current source to force the image preload
    image.src = imgSrc;
    image.onload = () => {
        $(".my-select").chosen({width:"100%"});
    }; // Clear the onload event to avoid any side effects during page loading
    image.onerror = () => {
        console.error(`Failed to load image: ${imgSrc}`);
    };
});

    $(".my-select").chosen({width:"100%"});
  
        // List of image filenames and corresponding text
        const items = [
            { img: "image.png", text: "Item 1" },
            { img: "image.png", text: "Item 2" },
            { img: "image.png", text: "Item 3" }
        ];

function init() {
        // Create a container for the select element
        const container = document.getElementById("selectContainer");

        // Create the select element
        const select = document.createElement("select");
        select.setAttribute('class', 'my-select');
        //select.setAttribute('style', 'display: none;');

        container.appendChild(select);

        items.forEach((item, index) => {
            // Create an option element and set its value to the index for later use
            const option = document.createElement("option");
            option.value = index;

            // Create an image element
            // const img = document.createElement("img");
            // img.src = `images/${item.img}`; // Replace "images/" with your actual images folder path

            // // Append the image to the option element
            // option.appendChild(img);

            option.setAttribute('data-img-src', `images/${item.img}`);

            // Append the text as option's innerHTML
            option.innerHTML += ` ${item.text}`;

            // Append the option to the select element
            select.appendChild(option);

            // Check if the image is fully loaded and force repaint of affected elements
            // if (img.complete) {
            //     select.scrollIntoView({ block: "center", inline: "nearest" });
            // } else {
            //     img.addEventListener("load", () => {
            //         select.scrollIntoView({ block: "center", inline: "nearest" });
            //     });
            // }
        });
    }
window.addEventListener("load", () => {
    setTimeout(() => {
        init();
    }, 100);
});

    </script>
</body>
</html>
