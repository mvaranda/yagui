// Function to create an option with image and text
function createOption(text, imageSrc) {
    const option = document.createElement("option");
    const container = document.createElement("div");
    container.classList.add("chosen-container-single");

    // Create the image element
    const img = document.createElement("img");
    img.src = imageSrc;
    img.alt = text;

    img.width = 36;
    img.height = 36;

    container.appendChild(img);

    // Create the text span
    const span = document.createElement("span");
    span.textContent = text;
    container.appendChild(span);

    option.appendChild(container);
    return option;
}

// Function to create the dynamic <select> element with image and text options
function createDynamicSelect() {
    // Create a new <select> element
    const select = document.createElement("select");
    select.className = "my-select";

    select.id = "mySelect";

    // Add some options for demonstration purposes
    for (let i = 1; i <= 5; i++) {
        const optionText = `Option ${i}`;
        //const imageSrc = `https://example.com/images/option${i}.png`;
        const imageSrc = "images/image.png";
        const option = createOption(optionText, imageSrc);
        select.appendChild(option);
    }

    // Append the newly created <select> element to the container
    const parentContainer = document.getElementById("my-container");
    parentContainer.appendChild(select);
}

// Initialize Chosen after the DOM is ready and create the dynamic <select> element
$(function() {
    createDynamicSelect();

    // Initialize Chosen for the newly created <select> element
    $("#mySelect").chosen({ width: "100%" }).on("create", function(event, element) {
        $(element).find(".chosen-container-single").show();
    });

    // Hover event to show the chosen-container-single for each option
    $("#mySelect").on("mouseenter", "option", function(event) {
        const option = $(event.currentTarget);
        option.find(".chosen-container-single").show();
    });

    // Hover event to hide the chosen-container-single for each option
    $("#mySelect").on("mouseleave", "option", function(event) {
        const option = $(event.currentTarget);
        option.find(".chosen-container-single").hide();
    });
});
